name: kilotax
description: "KiloTax - Australian Vehicle Tax & Mileage Micro-SaaS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  lucide_icons_flutter: ^3.1.18
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  geolocator: ^14.0.3
  flutter_svg: ^2.3.0
  google_mlkit_text_recognition: ^0.17.1
  cunning_document_scanner: ^3.0.2
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  flutter_blue_plus: ^2.3.12
  audio_session: ^0.2.4
  share_plus: ^13.3.0
  flutter_email_sender: ^6.0.3
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - google.svg
    - apple.svg
    - assets/vehicles/

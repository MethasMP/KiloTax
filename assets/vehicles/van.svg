<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none">
  <!-- Commercial Delivery Van (Apple / Tesla HIG Style Line-Art) -->
  <!-- Van Body Outline -->
  <path d="M5 21V19C5 18.2 5.6 17.5 6.4 17.4L11 16.5L14.2 7.8C14.7 7 15.6 6.5 16.5 6.5H41C42.1 6.5 43 7.4 43 8.5V21" 
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Driver Window -->
  <path d="M15.5 13H24V8.5H17C16.3 8.5 15.7 8.9 15.4 9.5L13.8 13" 
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sliding Cargo Door Seam -->
  <path d="M26 8.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M38 8.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Chassis Base -->
  <path d="M5 21H9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M18 21H30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M39 21H43" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Front Wheel & Rim -->
  <circle cx="13.5" cy="21" r="4.5" stroke="currentColor" stroke-width="2.2"/>
  <circle cx="13.5" cy="21" r="1.8" fill="currentColor"/>
  <!-- Rear Wheel & Rim -->
  <circle cx="34.5" cy="21" r="4.5" stroke="currentColor" stroke-width="2.2"/>
  <circle cx="34.5" cy="21" r="1.8" fill="currentColor"/>
</svg>

name: ATO Tax Rate Sentinel (Autonomous Gazette Crawler)

on:
  schedule:
    # 1. Peak Gazette Season (May - July): Check weekly every Monday at 02:00 UTC (12:00 PM AEST)
    - cron: '0 2 * 5-7 1'
    # 2. Regular Off-Peak Season (Aug - April): Check once a month on the 1st at 02:00 UTC
    - cron: '0 2 1 1-4,8-12 *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  crawl-and-sync:
    name: Crawl Federal Register of Legislation & Sync Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pypdf

      - name: Run ATO Sentinel Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/ato_sentinel.py

      - name: Check for Changes in Baseline
        id: git_status
        run: |
          git status --porcelain assets/data/ato_rates_baseline.json
          if [ -n "$(git status --porcelain assets/data/ato_rates_baseline.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push New Statutory Baseline
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --global user.name "KiloTax Statutory Sentinel Bot"
          git config --global user.email "bot@kilotax.com.au"
          git add assets/data/ato_rates_baseline.json
          git commit -m "chore(compliance): auto-update statutory ATO rates from Federal Register [skip ci]"
          git push origin main
